<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>RepoDeck · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        background: #0a0a0a;
        color: #f5f5f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
      }
      main {
        width: min(100%, 560px);
        border: 1px solid #292929;
        border-radius: 14px;
        background: #111;
        padding: 28px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }
      .brand {
        margin: 0 0 28px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 34px);
        line-height: 1.1;
      }
      p {
        margin: 14px 0 24px;
        color: #a3a3a3;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        text-decoration: none;
        appearance: none;
        border: 1px solid #3f3f46;
        border-radius: 9px;
        background: #fafafa;
        color: #0a0a0a;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      a:focus-visible {
        outline: 2px solid #fafafa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">RepoDeck</p>
      <h1>You’re offline</h1>
      <p>
        RepoDeck needs an internet connection to load repository data.
        Reconnect, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
